<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Участки на карте</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<style>
:root{--bg:#fff;--fg:#1d2430;--muted:#6b7280;--line:#e5e7eb;--panel:#f8fafc;--accent:#2563eb;--sel:#fde047}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111418;--fg:#e6e9ee;--muted:#9aa3ae;--line:#2a3038;--panel:#171b21;--accent:#60a5fa;--sel:#facc15}}
:root[data-theme="dark"]{--bg:#111418;--fg:#e6e9ee;--muted:#9aa3ae;--line:#2a3038;--panel:#171b21;--accent:#60a5fa;--sel:#facc15}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;height:100%}
#side{position:relative;z-index:2;width:340px;max-width:100%;flex:0 0 340px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
#side.closed{width:0;min-width:0;flex:0 0 0;border-right:0;overflow:visible}
#side.closed #toggle{left:0;border-left:1px solid var(--line)}
#side.closed header,#side.closed #list{display:none}
#side header{padding:12px 14px;border-bottom:1px solid var(--line)}
#side h1{font-size:16px;margin:0 0 8px}
.row{display:flex;gap:6px;margin-top:6px}
input,select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;min-width:0}
#stat{color:var(--muted);font-size:12px;margin-top:8px}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none}
#list li{padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
#list li:hover{background:var(--bg)}
#list li.nomap{opacity:.55;cursor:default}
#list .c{font-weight:600;font-variant-numeric:tabular-nums}
#list .s{color:var(--muted);font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
#map{flex:1;height:100%;position:relative;z-index:1;isolation:isolate}
.territory-label{background:var(--panel);color:var(--fg);border:2px solid var(--territory-color);border-radius:12px;padding:7px 10px;box-shadow:0 2px 8px #0003;text-align:center;font:12px/1.3 system-ui;min-width:130px;width:max-content;max-width:220px;transform:translate(-50%,-50%);cursor:pointer}
.territory-label strong{display:block}.territory-label small{color:var(--muted)}
#legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12px;color:var(--muted)}
#toggle{position:fixed;top:50%;left:340px;transform:translateY(-50%);z-index:2000;padding:8px 7px;border:1px solid var(--line);border-left:0;border-radius:0 6px 6px 0;background:var(--panel);color:var(--fg);font:inherit;font-size:12px;line-height:1.15;cursor:pointer;box-shadow:1px 1px 4px rgba(0,0,0,.18);writing-mode:vertical-rl}
.leaflet-popup-content{font-size:13px;line-height:1.45;margin:10px 12px}
.pp b{font-size:14px}
.pp table{border-collapse:collapse;margin-top:4px}
.pp td{padding:1px 8px 1px 0;vertical-align:top}
.pp td:first-child{color:var(--muted);white-space:nowrap}
.pp a{color:var(--accent)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--popBg,#fff);color:var(--popFg,#1d2430)}
.leaflet-tile-pane .tf{filter:var(--tileFilter,none)}
.leaflet-glPane-pane{pointer-events:none}
#themeBox{background:var(--panel);color:var(--fg);padding:4px 6px;border-radius:6px;font:12px system-ui;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#themeBox select{width:auto;padding:2px 4px;font-size:12px}
#list li.sel{background:var(--sel);color:#1d2430}
#editPanel{position:fixed;top:0;right:0;z-index:2500;width:min(360px,100%);height:100%;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);box-shadow:-4px 0 24px rgba(0,0,0,.15)}
#editPanel[hidden]{display:none !important}
#editPanel header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#editPanel h2{margin:0;font-size:15px}
#editPanel .meta{color:var(--muted);font-size:11px;margin-top:4px}
#editPanel form{flex:1;overflow:auto;padding:12px 14px}
#editPanel label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
#editPanel label:first-child{margin-top:0}
#editPanel .cadro{font-family:ui-monospace,Consolas,monospace;font-size:13px}
#editFoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#editFoot .actions{display:flex;flex-wrap:wrap;gap:6px}
#editPanel button,#editPanel .btn{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer;text-decoration:none;font-size:13px}
#editPanel button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#editStatus{flex:1 1 100%;font-size:11px;color:var(--muted);min-height:1.2em}
@media (max-width:760px){
  #app{flex-direction:column}
  #side{width:100%;flex:0 0 auto;height:auto;max-height:45%;border-right:0;border-bottom:1px solid var(--line)}
  #side.closed{width:100%;flex:0 0 0;height:0;max-height:0;border:0}
  #toggle{top:8px;right:8px;left:auto;transform:none;writing-mode:horizontal-tb;border-left:1px solid var(--line);border-radius:6px;position:absolute}
  #side.closed #toggle{position:fixed;top:8px;left:8px;right:auto}
  #side h1{padding-right:78px}
  #side header{padding:10px 16px}
  #list li{padding:8px 16px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <button id="toggle" type="button" aria-controls="side" aria-expanded="true" aria-label="Скрыть список участков">Скрыть</button>
    <header>
      <h1>Участки: Симферопольский р-н и Алушта</h1>
      <input id="q" type="search" placeholder="Кадастровый номер или адрес">
      <div class="row">
        <select id="sh"><option value="">Все муниципальные территории</option></select>
        <select id="pr">
          <option value="">Любая цена</option>
          <option value="0-2000000">до 2 млн</option>
          <option value="2000000-3500000">2–3,5 млн</option>
          <option value="3500000-5000000">3,5–5 млн</option>
          <option value="5000000-999999999">от 5 млн</option>
        </select>
      </div>
      <div class="row">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none">
          <input id="clientView" type="checkbox" style="width:auto;margin:0"> Показ клиенту
        </label>
      </div>
      <div class="row"><select id="village" aria-label="Населённый пункт"><option value="">Все населённые пункты</option></select></div>
      <div id="hierarchyHint" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
      <div id="legend"></div>
      <div id="stat"></div>
    </header>
    <ul id="list"></ul>
  </aside>
  <div id="map"></div>
</div>
<div id="editPanel" hidden aria-hidden="true" aria-labelledby="editTitle">
  <header>
    <div>
      <h2 id="editTitle">Редактор объекта</h2>
      <div class="meta">Ctrl+Y · закрыть Ctrl+N</div>
    </div>
    <button type="button" id="editClose" aria-label="Закрыть редактор">×</button>
  </header>
  <form id="editForm" onsubmit="return false">
    <label>Кадастровый номер<input id="edCad" class="cadro" type="text" readonly tabindex="-1"></label>
    <label>Топнлаб id<input id="edId" class="cadro" type="text" inputmode="numeric" autocomplete="off"></label>
    <label>Цена, ₽<input id="edPrice" type="number" min="0" step="1000"></label>
    <label>Населённый пункт<input id="edVill" type="text" placeholder="например Доброе"></label>
    <label>Поселение <span id="editColorDot" class="dot" title="цвет на карте"></span><input id="edSheet" type="text" placeholder="например Добровское"></label>
    <label>Тип (kind)<input id="edKind" type="text" placeholder="участок / дом"></label>
    <label>Заголовок<input id="edTitle" type="text"></label>
    <label>Агент<input id="edAgent" type="text"></label>
    <label>src<input id="edSrc" type="text"></label>
    <label>Авито URL<input id="edAvito" type="url"></label>
  </form>
  <div id="editFoot">
    <div id="editStatus"></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:0 0 8px;cursor:pointer;user-select:none">
      <input id="editAutoPick" type="checkbox" style="width:auto;margin:0"> Авто: клик по объекту открывает редактор (после пароля)
    </label>
    <div class="actions">
      <button type="button" class="primary" id="editApply">Применить</button>
      <button type="button" id="editPatch">Скачать patch</button>
      <a class="btn" id="editTopnlab" href="#" target="_blank" rel="noopener" hidden>Карточка CRM</a>
    </div>
  </div>
</div>
<script src="data/objects.js?v=202611161822"></script>
<script src="data/grid/index.js?v=202611161822"></script>
<script>
const THEMES = {};
// Theme: обычная. A theme is one object in THEMES; every file in themes\ is inlined by build.ps1.
// Fields: label, vars (panel CSS colours), css (extra CSS), tileFilter (CSS filter on map tiles),
// grid (style of the cadastral grid), ours(color) (style of our plots), marker(color), point(color).
THEMES.obychnaya = {
  label: "Обычная",
  vars: {bg:"#ffffff", fg:"#1d2430", muted:"#6b7280", line:"#e5e7eb", panel:"#f8fafc", accent:"#2563eb", popBg:"#ffffff", popFg:"#1d2430"},
  css: "",
  tileFilter: "none",
  grid: {color:"#ef4444", weight:1, opacity:.9, fillColor:"#ef4444", fillOpacity:.04},
  ours: c => ({color:c, weight:2, fillColor:c, fillOpacity:.35}),
  marker: c => ({radius:5, color:"#ffffff", weight:1, fillColor:c, fillOpacity:1}),
  point: c => ({radius:7, color:c, weight:2, dashArray:"3 3", fillOpacity:.15}),
  colorOf: null
};

// Theme: киберпанк (Cyberpunk 2077 look: night city, red grid, blue plots, HUD panel).
// Optional module: delete this file and rebuild to ship the map without it.
THEMES.kiberpank = {
  label: "Киберпанк",
  vars: {bg:"#07070d", fg:"#e8f7ff", muted:"#7fb8c9", line:"#1d3a4a", panel:"#0b0b16", accent:"#05d9e8", popBg:"#0b0b16", popFg:"#e8f7ff"},
  fontUrl: "https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap",
  css: `
    body{font-family:"Rajdhani","Share Tech Mono",system-ui,sans-serif;letter-spacing:.02em}
    #side{border-right:1px solid #ff2a6d;box-shadow:0 0 18px rgba(255,42,109,.25) inset}
    #side h1{color:#fcee0a;text-transform:uppercase;letter-spacing:.08em;text-shadow:0 0 6px rgba(252,238,10,.6)}
    #list .c{font-family:"Share Tech Mono",monospace;color:#05d9e8}
    #list li:hover{background:#12122a;box-shadow:inset 3px 0 0 #ff2a6d}
    input,select{border-color:#1d3a4a;box-shadow:0 0 0 1px rgba(5,217,232,.15) inset}
    .leaflet-popup-content-wrapper{border:1px solid #ff2a6d;box-shadow:0 0 14px rgba(255,42,109,.45)}
    .pp b{font-family:"Share Tech Mono",monospace;color:#05d9e8}
    .pp a{color:#fcee0a}
    .leaflet-control-layers,.leaflet-bar a{background:#0b0b16;color:#e8f7ff;border-color:#ff2a6d}
  `,
  // Night-city look on top of any basemap: darken, push towards blue/magenta.
  tileFilter: "brightness(.55) contrast(1.35) saturate(1.6) hue-rotate(185deg)",
  grid: {color:"#ff2a6d", weight:1, opacity:1, fillColor:"#ff2a6d", fillOpacity:.06},
  ours: c => ({color:c, weight:2, fillColor:c, fillOpacity:.3}),
  marker: c => ({radius:5, color:"#fcee0a", weight:1, fillColor:c, fillOpacity:1}),
  point: c => ({radius:7, color:c, fillColor:c, weight:2, dashArray:"3 3", fillOpacity:.1}),
  // Territory/locality colours remain consistent in both themes.
  colorOf: null,
  // 2GIS works everywhere (tablets included) and is recoloured below, so the theme switches to it.
  preferBase: "gis",
  // Pixel recolour of 2GIS tiles by colour class: background black, buildings red, main roads cyan,
  // minor streets dark cyan, water dark blue, parks near-black green, dark labels light cyan.
  recolor: (r, g, b) => {
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 510;
    const s = d === 0 ? 0 : d / (255 - Math.abs(mx + mn - 255));
    let h = 0;
    if (d) { h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
    // Thresholds measured on real 2GIS tiles: background #F0F0E0/#F0E8D0, streets #F8F8F8, main roads #F8F0D8,
    // buildings #D8D8C0..#C8C0B0, parks #B8D880.
    if (h >= 185 && h <= 235 && s > .25 && l < .9) return [6, 24, 46];             // water
    if (h >= 70 && h <= 170 && s > .2 && l < .86) return [10, 26, 20];             // parks, forest
    if (h >= 25 && h <= 60 && s > .6 && l > .86) return [5, 217, 232];             // main roads (light yellow)
    if (h >= 15 && h <= 45 && s > .6 && l > .55 && l <= .86) return [5, 217, 232]; // highways (orange)
    if (l > .945 && s < .5) return [14, 120, 135];                                  // streets (white)
    if (l > .84) return [7, 7, 13];                                                 // background
    if (l > .6 && s < .4) return [122, 20, 36];                                     // buildings
    if (l < .5 && s < .3) return [184, 244, 255];                                   // labels, house numbers
    return [Math.round(r * .35), Math.round(g * .35), Math.round(b * .5)];         // icons and the rest, dimmed
  },
  // Satellite stays usable in this theme through a CSS filter; 2GIS tiles are recoloured instead.
  // Recolour the OpenFreeMap vector style: black ground, dark-blue water, red buildings, cyan roads, yellow places.
  vector: (s, mode) => {
    for (const l of s.layers) {
      const p = l.paint = l.paint || {}; const sl = l["source-layer"] || ""; const f = JSON.stringify(l.filter || "");
      if (l.type === "background") p["background-color"] = "#07070d";
      else if (l.type === "fill") {
        delete p["fill-pattern"];
        if (sl === "water") { p["fill-color"] = "#06182e"; p["fill-opacity"] = 1; }
        else if (sl === "building") { p["fill-color"] = "#7a1424"; p["fill-opacity"] = .9; p["fill-outline-color"] = "#ff2a6d"; }
        else { p["fill-color"] = "#0c0c16"; p["fill-opacity"] = .7; }
      }
      else if (l.type === "fill-extrusion") { p["fill-extrusion-color"] = "#8b1a2b"; p["fill-extrusion-opacity"] = .85; }
      else if (l.type === "line") {
        delete p["line-pattern"];
        if (sl === "transportation") { p["line-color"] = /motorway|trunk|primary/.test(f) ? "#05d9e8" : "#0e8c99"; p["line-opacity"] = mode === "hybrid" ? .8 : 1; }
        else if (sl === "waterway") p["line-color"] = "#0a3a66";
        else if (sl === "boundary") p["line-color"] = "#ff2a6d";
        else p["line-color"] = "#1d3a4a";
      }
      else if (l.type === "symbol") {
        p["text-color"] = /place/.test(sl) ? "#fcee0a" : "#05d9e8";
        p["text-halo-color"] = "#000000"; p["text-halo-width"] = 1.2;
        if (/poi/.test(sl)) { l.layout = l.layout || {}; l.layout.visibility = "none"; }
      }
      else if (l.type === "hillshade" || l.type === "raster") { l.layout = l.layout || {}; l.layout.visibility = "none"; }
    }
    return s;
  }
};

// Site build: objects come from data/objects.js (window.OBJECTS); single-file build inlines them here.
const DATA = window.OBJECTS || [];
// Plots without an NSPD outline arrive with an empty geometry object.
for (const d of DATA) {
  if (!d.g || !Array.isArray(d.g.coordinates)) { d.g = null; continue; }
  // NSPD gives a point instead of an outline when the plot has no surveyed boundary.
  d.point = d.g.type === "Point";
  // Drop positions outside Crimea: they come from mistyped cadastral numbers.
  let lon = 0, lat = 0, k = 0; const walk = c => Array.isArray(c[0]) ? c.forEach(walk) : (lon += c[0], lat += c[1], k++); walk(d.g.coordinates);
  lon /= k; lat /= k; if (lon < 32.4 || lon > 36.7 || lat < 44.3 || lat > 46.3) { d.g = null; d.point = false; d.bad = true; }
}
const NEIGH = [];
const BUILT = "16.11.2026";
const POS_OF = {"Дмитрово":"Донское","Молодежное":"Молодежненское","Мраморное":"Добровское","Трудолюбово":"Чистенское","Кипарисное":"г.о. Алушта","Николаевка":"Николаевское","Утёс":"г.о. Алушта","Чайковское":"Добровское","Краснолесье":"Добровское","Дубки":"Перовское","Чайка":"г.о. Алушта","Партенит":"г.о. Алушта","Новозбурьевка":"Чистенское","Алушта":"г.о. Алушта","Партизанское":"Перовское","Мазанка":"Мазанское","Генеральское":"г.о. Алушта","Пионерское":"Добровское","Веселое":"Перовское","Лозовое":"Добровское","Трехпрудное":"Чистенское","Левадки":"Чистенское","Ферсманово":"Добровское","Клиновка":"Перовское","Лазурное":"г.о. Алушта","Скворцово":"Скворцовское","Семидворье":"г.о. Алушта","Денисовка":"Трудовское","Малый Маяк":"г.о. Алушта","Винницкое":"Николаевское","Ключи":"Перовское","Лазаревка":"Трудовское","Петропавловка":"Добровское","Ана-Юрт":"Трудовское","Перевальное":"Добровское","Солнечное":"Молодежненское","Лаванда":"г.о. Алушта","Белоглинка":"Мирновское","Доброе":"Добровское","Привольное":"Добровское","Мирное":"Мирновское","Малореченское":"г.о. Алушта","Андрусово":"Добровское","Урожайное":"Трудовское","Молочное":"Перовское","Виноградное":"г.о. Алушта","Запрудное":"г.о. Алушта","Нижнее Запрудное":"г.о. Алушта","Тепловка":"Николаевское","Камышинка":"Чистенское","Нижняя Кутузовка":"г.о. Алушта","Трудовое":"Трудовское","Пушкино":"г.о. Алушта","Строгановка":"Трудовское","Клёновка":"Донское","Украинка":"Перовское","Нижнее":"г.о. Алушта","Ивановка":"Трудовское","Чистенькое":"Чистенское","Заречное":"Добровское","Рыбачье":"г.о. Алушта","Изобильное":"г.о. Алушта","Лавровое":"г.о. Алушта","Лучистое":"г.о. Алушта","Каштановое":"Перовское","Дружное":"Трудовское","Акрополис":"Трудовское","Айкаван":"Трудовское","Фонтаны":"Чистенское","Обрыв":"Перовское","Красновка":"Мазанское","Перово":"Перовское","Константиновка":"Перовское","Верхняя Кутузовка":"г.о. Алушта","Розовый":"г.о. Алушта","Солнечногорское":"г.о. Алушта"};
const COLORS = {"Трудовское":"#e11d48","Перовское":"#2563eb","Мирновское":"#16a34a","Чистенское":"#d97706","Добровское":"#7c3aed"};
const PALETTE = ["#0891b2","#db2777","#65a30d","#ea580c","#4f46e5","#0d9488","#b45309","#9333ea","#dc2626","#0284c7","#ca8a04","#059669"];
const col = s => { if (COLORS[s]) return COLORS[s]; let h = 0; for (const ch of String(s||"")) h = (h*31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
// Current theme; defined before any layer is built because layer styles call theme().
let themeKey = "obychnaya";
try { const k = localStorage.getItem("mapTheme"); if (k && THEMES[k]) themeKey = k; } catch (e) {}
if (!THEMES[themeKey]) themeKey = Object.keys(THEMES)[0];
const FALLBACK = {grid:{color:"#ef4444",weight:1,fillOpacity:.04}, ours:c=>({color:c,weight:2,fillColor:c,fillOpacity:.35}), marker:c=>({radius:5,color:"#fff",weight:1,fillColor:c,fillOpacity:1}), point:c=>({radius:7,color:c,weight:2,dashArray:"3 3",fillOpacity:.15})};
function theme(){ return THEMES[themeKey] || FALLBACK; }
function colOf(s){ const t = theme(); return t.colorOf ? t.colorOf(s) : col(s); }
// Municipalities on the overview; individual localities when zoomed in.
const VILLAGE_ZOOM = 12;

const RecolorTiles = L.GridLayer.extend({
  createTile(coords, done){
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const img = new Image(); img.crossOrigin = "anonymous";
    const sub = "123"[(coords.x + coords.y) % 3];
    img.onload = () => {

      const fn = theme().recolor;
      if (fn) { try { const im = ctx.getImageData(0, 0, 256, 256), p = im.data;
        for (let i = 0; i < p.length; i += 4) { const o = fn(p[i], p[i+1], p[i+2]); p[i] = o[0]; p[i+1] = o[1]; p[i+2] = o[2]; }

  const c = lyr.getBounds().getCenter();
  const m = L.circleMarker(c, theme().marker(colOfPlot(d)));
  m.bindPopup(() => popup(d), {maxWidth:320});
  m.bindTooltip(d.cad);
  const pick = () => pickObject(d);
  lyr.on("click", pick);
  m.on("click", pick);
  layers.set(d.cad, {d, lyr, m});
}

const sheets = [...new Set(DATA.map(d=>d.sheet).filter(Boolean))].sort();
const shSel = document.getElementById("sh");
for (const s of sheets) shSel.add(new Option(territoryName(s), s));
if (DATA.some(d=>!d.sheet)) shSel.add(new Option("Территория не уточнена", "__unknownTerritory"));
const villageSel = document.getElementById("village");
function syncVillages(){
  const previous = villageSel.value;
  villageSel.innerHTML = '<option value="">Все населённые пункты</option>';
  const values = [...new Set(DATA.filter(d => !shSel.value || (d.sheet || "__unknownTerritory") === shSel.value).map(d => d.vill || "__unknown"))].sort((a,b)=>a.localeCompare(b,"ru"));
  for (const v of values) villageSel.add(new Option(v === "__unknown" ? "Населённый пункт не уточнён" : localityName(v), v));
  villageSel.value = values.includes(previous) ? previous : "";
}
syncVillages();
shSel.addEventListener("input", syncVillages);
const overviewControl = L.control({position:"bottomleft"});
overviewControl.onAdd = () => {
  const button = L.DomUtil.create("button", "territory-label");
  button.type = "button";
  button.textContent = "← Все территории";
  button.style.cssText = "transform:none;--territory-color:var(--accent)";
  L.DomEvent.disableClickPropagation(button);
  L.DomEvent.on(button, "click", () => {
    shSel.value = ""; villageSel.value = ""; syncVillages();
    const shown = apply().filter(d=>layers.has(d.cad));
    if (shown.length) map.fitBounds(L.latLngBounds(shown.map(d=>layers.get(d.cad).m.getLatLng())), {padding:[30,30],maxZoom:VILLAGE_ZOOM-1,animate:false});
  });
  return button;
};
overviewControl.addTo(map);


// Themes: pick from THEMES (files in themes\), remember the choice, restyle everything in place.
function applyTheme(){
  const t = theme(); const r = document.documentElement.style;
  for (const [k, v] of Object.entries(t.vars || {})) r.setProperty("--" + k, v);
  r.setProperty("--tileFilter", t.tileFilter || "none");
  themeStyle.textContent = t.css || "";
  if (t.fontUrl && !document.querySelector(`link[href="${t.fontUrl}"]`)) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = t.fontUrl; document.head.appendChild(l); }
  neigh.eachLayer(g => g.setStyle && g.setStyle(t.grid));
  for (const {d, lyr, m} of layers.values()) {
    const c = colOfPlot(d);
    lyr.eachLayer(x => x.setStyle(x instanceof L.CircleMarker ? t.point(c) : t.ours(c)));
    m.setStyle(t.marker(c));
  }
  refreshGL();
  if (map.hasLayer(gis)) gis.redraw();
  try { localStorage.setItem("mapTheme", themeKey); } catch (e) {}
}
if (Object.keys(THEMES).length > 1) {
  const ctl = L.control({position:"topleft"});
  ctl.onAdd = () => { const box = L.DomUtil.create("div"); box.id = "themeBox";
    box.innerHTML = `Тема: <select id="themeSel">${Object.entries(THEMES).map(([k,v]) => `<option value="${k}"${k===themeKey?" selected":""}>${esc(v.label)}</option>`).join("")}</select>`;
    L.DomEvent.disableClickPropagation(box); return box; };
  ctl.addTo(map);
  document.getElementById("themeSel").addEventListener("change", e => {
    themeKey = e.target.value; applyTheme(); apply();
    // A theme may prefer a basemap (the cyberpunk one looks like the game map on the street scheme).
    const pref = theme().preferBase; const want = pref === "gis" ? gis : pref === "scheme" ? (usingFallback ? gis : scheme) : pref === "hybrid" ? hybrid : null;
    if (want && !map.hasLayer(want)) { for (const b of Object.values(BASES)) if (map.hasLayer(b)) map.removeLayer(b); want.addTo(map); }
  });
}

function renderTerritories(shown){
  const villages = map.getZoom() >= VILLAGE_ZOOM;
  document.getElementById("hierarchyHint").textContent = villages ? "Цвет участков — по населённым пунктам" : "Цвет участков — по муниципальным территориям";
  const groups = new Map();
  for (const d of shown){
    const key = plotColorKey(d);
    if (!groups.has(key)) groups.set(key, d);
  }
  document.getElementById("legend").innerHTML = [...groups.values()].slice(0,18).map(d=>
    '<span><span class="dot" style="background:'+colOfPlot(d)+'"></span>'+esc(villages ? (d.vill ? localityName(d.vill) : territoryName(d.sheet)) : territoryName(d.sheet))+'</span>'
  ).join("");
}
map.on("zoomend", ()=>apply());
const list = document.getElementById("list"), stat = document.getElementById("stat");
function apply(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sh = shSel.value;
  const village = villageSel.value;
  const [lo, hi] = (document.getElementById("pr").value || "0-1e12").split("-").map(Number);
  const shown = [];
  for (const d of DATA) {
    const ok = (!sh || (d.sheet || "__unknownTerritory")===sh) && (!village || (d.vill || "__unknown") === village) && (d.price||0)>=lo && (d.price||0)<hi &&
      (!q || d.cad.toLowerCase().includes(q) || (d.addr||"").toLowerCase().includes(q));
    const L1 = layers.get(d.cad);
    if (L1) {
      const c = colOfPlot(d), t = theme();
      L1.lyr.eachLayer(x => x.setStyle(x instanceof L.CircleMarker ? t.point(c) : t.ours(c)));
      L1.m.setStyle(t.marker(c));
      if (ok) { L1.lyr.addTo(map); L1.m.addTo(map); }
      else { L1.lyr.remove(); L1.m.remove(); }
    }
    if (ok) shown.push(d);
  }
  renderTerritories(shown);
  const onMap = shown.filter(d=>layers.has(d.cad)).length;
  stat.textContent = `Показано ${shown.length} из ${DATA.length}, на карте ${onMap}. Данные на ${BUILT}.`;
  list.innerHTML = shown.map(d => `<li data-c="${esc(d.cad)}" class="${layers.has(d.cad)?"":"nomap"}"><span class="dot" style="background:${colOfPlot(d)}"></span><span class="c">${esc(d.cad)}</span> · ${d.price?fmt(d.price/1000)+" тыс. ₽":"—"}<div class="s">${esc(territoryName(d.sheet))}${d.vill?" · "+esc(d.vill):""}${d.area?" · "+(d.area/100).toFixed(1).replace(".",",")+" сот.":""}${layers.has(d.cad) ? (d.point ? " · без границ, точка" : "") : (d.bad ? " · номер с ошибкой" : " · нет в НСПД")}</div></li>`).join("");
  return shown;
}
list.addEventListener("click", e => {
  const li = e.target.closest("li"); if (!li) return;
  const L1 = layers.get(li.dataset.c); if (!L1) return;
  pickObject(L1.d);
  map.fitBounds(L1.lyr.getBounds(), {maxZoom:18});
  L1.lyr.openPopup(L1.lyr.getBounds().getCenter());
  if (innerWidth <= 760) setSideClosed(true, false);
});
for (const id of ["q","sh","pr","village"]) document.getElementById(id).addEventListener("input", apply);
const clientCb = document.getElementById("clientView");
try { if (localStorage.getItem("mapClientView") === "1") clientCb.checked = true; } catch (e) {}
function refreshOpenPopups(){
  map.eachLayer(l => { if (l.getPopup && l.getPopup() && map.hasLayer(l) && l.isPopupOpen && l.isPopupOpen()) l.openPopup(); });
}
clientCb.addEventListener("change", () => {
  try { localStorage.setItem("mapClientView", clientCb.checked ? "1" : "0"); } catch (e) {}
  refreshOpenPopups();
});
function syncToggle(){
  const closed = sideEl.classList.contains("closed");
  toggleBtn.setAttribute("aria-expanded", closed ? "false" : "true");
  toggleBtn.textContent = closed ? "Список" : "Скрыть";
  toggleBtn.setAttribute("aria-label", closed ? "Показать список участков" : "Скрыть список участков");
}
function setSideClosed(closed, persist){
  sideEl.classList.toggle("closed", closed);
  syncToggle();
  if (persist) { try { localStorage.setItem("mapSideClosed", closed ? "1" : "0"); } catch (e) {} }
  map.invalidateSize();
}
syncToggle();
toggleBtn.addEventListener("click", () => setSideClosed(!sideEl.classList.contains("closed"), true));
applyTheme();
apply();
const all = [...layers.values()].map(x=>x.m.getLatLng());
if (all.length) map.fitBounds(L.latLngBounds(all), {padding:[30,30]});
</script>
</body>
</html>

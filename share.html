<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Подборка объектов</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><style>body{margin:0;font:15px system-ui;color:#20352b;background:#f4f7f5}header{padding:16px}h1{font-size:22px;margin:0}#map{height:45dvh}#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;padding:14px}article{background:white;border:1px solid #dae4dd;border-radius:14px;padding:15px}button,a{min-height:40px;display:inline-flex;align-items:center;margin:4px;border-radius:7px}button{border:1px solid #ccd7cf;background:white;padding:6px 12px}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}#comparison{overflow:auto;padding:12px}[hidden]{display:none!important}</style><header><h1>Подборка объектов</h1><p id="status">Загружаем подборку…</p><button id="compare" hidden>Сравнить</button></header><div id="map" hidden></div><div id="comparison" hidden></div><main id="list"></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':Number(n).toLocaleString('ru-RU');
const copy=s=>navigator.clipboard.writeText(s).catch(()=>prompt('Скопируйте:',s));
(async()=>{try{const r=await fetch('/api/registry?action=view&id='+encodeURIComponent(location.hash.slice(1)),{cache:'no-store'});const s=await r.json();if(!r.ok)throw Error(s.error);
 document.getElementById('status').textContent=s.count+' объектов · данные на '+new Date(s.createdAt).toLocaleString('ru-RU')+' · доступно до '+new Date(s.expiresAt).toLocaleString('ru-RU');
 const mapElement=document.getElementById('map');mapElement.hidden=false;const map=L.map(mapElement).setView([44.8,34.2],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const group=L.featureGroup().addTo(map);
 const area=d=>!['квартира','апартаменты','комната'].includes(d.kind)&&Number(d.area)>0?Number(d.area)/100:null;
 const unit=d=>/зем|участ|зу/i.test(d.kind||d.title||'')&&area(d)&&d.price>0?Math.round(d.price/area(d)):null;
 const rows=s.objects;document.getElementById('list').innerHTML=rows.map(d=>'<article><b>'+esc(d.vill||d.sheet||'Объект')+'</b><h2>'+fmt(d.price)+' ₽</h2><p>'+fmt(area(d))+' сот. · '+fmt(unit(d))+' ₽/сот.</p><p>'+esc(d.cad)+' <button data-copy="'+esc(d.cad)+'" aria-label="Копировать кадастр">⧉</button></p>'+(d.id?'<a target="_blank" rel="noopener noreferrer" href="https://crm.topnlab.ru/object-card/'+encodeURIComponent(d.id)+'">ID '+esc(d.id)+'</a><button data-copy="'+esc(d.id)+'" aria-label="Копировать ID">⧉</button>':'')+'<p>'+esc(d.addr||'')+'</p></article>').join('');
 document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b)copy(b.dataset.copy);});
 for(const d of rows)if(d.g&&d.g.coordinates){try{L.geoJSON({type:'Feature',geometry:d.g,properties:{}},{style:{color:'#176546',weight:2,fillOpacity:0.3}}).bindPopup(esc(d.cad)+'<br>'+fmt(d.price)+' ₽').addTo(group);}catch{}}
 if(group.getLayers().length)map.fitBounds(group.getBounds(),{padding:[20,20],maxZoom:16});
 const comparison=document.getElementById('comparison');comparison.innerHTML='<table><thead><tr><th>Кадастр</th><th>Населённый пункт</th><th>Сотки</th><th>Цена, ₽</th><th>₽/сот.</th><th>ID Топнлаба</th></tr></thead><tbody>'+rows.map(d=>'<tr><td>'+esc(d.cad)+'</td><td>'+esc(d.vill)+'</td><td>'+fmt(area(d))+'</td><td>'+fmt(d.price)+'</td><td>'+fmt(unit(d))+'</td><td>'+(d.id?'<a target="_blank" rel="noopener noreferrer" href="https://crm.topnlab.ru/object-card/'+encodeURIComponent(d.id)+'">'+esc(d.id)+'</a>':'—')+'</td></tr>').join('')+'</tbody></table>';
 const button=document.getElementById('compare');button.hidden=false;button.onclick=()=>{comparison.hidden=!comparison.hidden;document.getElementById('list').hidden=!comparison.hidden;};
 }catch(e){document.getElementById('status').textContent=e.message||'Подборка недоступна.';}})();
</script></html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="map-release" content="2026-11-18-compact-ui">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Участки на карте</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<style>
:root{--bg:#fff;--fg:#1d2430;--muted:#6b7280;--line:#e5e7eb;--panel:#f8fafc;--accent:#2563eb;--sel:#fde047}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111418;--fg:#e6e9ee;--muted:#9aa3ae;--line:#2a3038;--panel:#171b21;--accent:#60a5fa;--sel:#facc15}}
:root[data-theme="dark"]{--bg:#111418;--fg:#e6e9ee;--muted:#9aa3ae;--line:#2a3038;--panel:#171b21;--accent:#60a5fa;--sel:#facc15}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;height:100%}
#side{position:relative;z-index:2;width:340px;max-width:100%;flex:0 0 340px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
#side.closed{width:0;min-width:0;flex:0 0 0;border-right:0;overflow:visible}
#side.closed #toggle{left:0;border-left:1px solid var(--line)}
#side.closed header,#side.closed #list{display:none}
#side header{padding:12px 14px;border-bottom:1px solid var(--line)}
#side h1{font-size:16px;margin:0 0 8px}
.row{display:flex;gap:6px;margin-top:6px}
input,select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;min-width:0}
#stat{color:var(--muted);font-size:12px;margin-top:8px}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none}
#list li{padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
#list li:hover{background:var(--bg)}
#list li.nomap{opacity:.55;cursor:default}
#list .c{font-weight:600;font-variant-numeric:tabular-nums}
#list .s{color:var(--muted);font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
#map{flex:1;height:100%;position:relative;z-index:1;isolation:isolate}
.territory-label{background:var(--panel);color:var(--fg);border:2px solid var(--territory-color);border-radius:12px;padding:7px 10px;box-shadow:0 2px 8px #0003;text-align:center;font:12px/1.3 system-ui;min-width:130px;width:max-content;max-width:220px;transform:translate(-50%,-50%);cursor:pointer}
.territory-label strong{display:block}.territory-label small{color:var(--muted)}
#legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12px;color:var(--muted)}
#toggle{position:fixed;top:50%;left:340px;transform:translateY(-50%);z-index:2000;padding:8px 7px;border:1px solid var(--line);border-left:0;border-radius:0 6px 6px 0;background:var(--panel);color:var(--fg);font:inherit;font-size:12px;line-height:1.15;cursor:pointer;box-shadow:1px 1px 4px rgba(0,0,0,.18);writing-mode:vertical-rl}
.leaflet-popup-content{font-size:13px;line-height:1.45;margin:10px 12px}
.pp b{font-size:14px}
.pp table{border-collapse:collapse;margin-top:4px}
.pp td{padding:1px 8px 1px 0;vertical-align:top}
.pp td:first-child{color:var(--muted);white-space:nowrap}
.pp a{color:var(--accent)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--popBg,#fff);color:var(--popFg,#1d2430)}
.leaflet-tile-pane .tf{filter:var(--tileFilter,none)}
.leaflet-glPane-pane{pointer-events:none}
#themeBox{background:var(--panel);color:var(--fg);padding:4px 6px;border-radius:6px;font:12px system-ui;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#themeBox select{width:auto;padding:2px 4px;font-size:12px}
#list li.sel{background:var(--sel);color:#1d2430}
#editPanel{position:fixed;top:0;right:0;z-index:2500;width:min(360px,100%);height:100%;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);box-shadow:-4px 0 24px rgba(0,0,0,.15)}
#editPanel[hidden]{display:none !important}
#editPanel header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#editPanel h2{margin:0;font-size:15px}
#editPanel .meta{color:var(--muted);font-size:11px;margin-top:4px}
#editPanel form{flex:1;overflow:auto;padding:12px 14px}
#editPanel label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
#editPanel label:first-child{margin-top:0}
#editPanel .cadro{font-family:ui-monospace,Consolas,monospace;font-size:13px}
#editFoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#editFoot .actions{display:flex;flex-wrap:wrap;gap:6px}
#editPanel button,#editPanel .btn{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer;text-decoration:none;font-size:13px}
#editPanel button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#editStatus{flex:1 1 100%;font-size:11px;color:var(--muted);min-height:1.2em}
@media (max-width:760px){
  #app{flex-direction:column}
  #side{width:100%;flex:0 0 auto;height:auto;max-height:45%;border-right:0;border-bottom:1px solid var(--line)}
  #side.closed{width:100%;flex:0 0 0;height:0;max-height:0;border:0}
  #toggle{top:8px;right:8px;left:auto;transform:none;writing-mode:horizontal-tb;border-left:1px solid var(--line);border-radius:6px;position:absolute}
  #side.closed #toggle{position:fixed;top:8px;left:8px;right:auto}
  #side h1{padding-right:78px}
  #side header{padding:10px 16px}
  #list li{padding:8px 16px}
}

#side header{max-height:58%;overflow:auto;flex-shrink:0}
#side.closed #selectionBar{display:none}
.filterLabel{display:block;font-size:12px;color:var(--muted);margin-top:8px}
.filterLabel .row{margin-top:3px}
#numericFilters{margin-top:8px}#numericFilters summary{cursor:pointer}
#filterError{color:#b45309;font-size:12px;min-height:1em}
#selectionBar{padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px}
#selectionBar .row{flex-wrap:wrap}
button.action{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
button.action:disabled{opacity:.45;cursor:default}
button.action[aria-pressed="true"]{background:var(--accent);color:white}
#list li.picked{box-shadow:inset 4px 0 #f59e0b;background:color-mix(in srgb,var(--panel) 80%,#f59e0b 20%)}
#list input.pickCheck{width:18px;height:18px;margin:0 7px 0 0;vertical-align:middle;accent-color:#d97706;cursor:pointer}
.selection-rect{position:absolute;pointer-events:none;z-index:650;border:2px solid #f59e0b;background:transparent;box-shadow:0 0 0 10000px rgba(0,0,0,.58)}
#compareDialog{width:min(1100px,96vw);max-height:88dvh;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg)}
#compareDialog::backdrop{background:#0007}
#compareDialog header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#compareDialog h2{margin:0;font-size:17px}
.compareScroll{overflow:auto;max-height:65dvh}
#compareDialog table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}
#compareDialog td,#compareDialog th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
#compareDialog th{position:sticky;top:0;background:var(--panel)}
#compareDialog a{color:var(--accent)}
#compareNote{padding:10px 16px;font-size:12px;color:var(--muted)}
@media(max-width:760px){#side{max-height:55%}#side header{max-height:27dvh}#selectionBar{padding:6px 14px}#compareDialog{width:98vw}}

#map{overflow:hidden}
#touchTools{display:none;background:var(--panel);color:var(--fg);padding:7px;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px #0003;max-width:310px}
#touchTools .row{margin:0;gap:5px;flex-wrap:wrap}
#touchTools button{min-height:44px;min-width:44px}
#touchModeHint{font-size:12px;max-width:275px;margin-top:5px}
#side h1{-webkit-touch-callout:none;user-select:none}
@media(pointer:coarse),(max-width:760px){
  #touchTools{display:block}
  input,select,button.action{font-size:16px;min-height:44px}
  #list input.pickCheck{width:24px;height:24px;min-height:24px}
  #list li{padding-top:12px;padding-bottom:12px}
  #editPanel{width:min(440px,100%)}
  #editFoot{padding-bottom:max(10px,env(safe-area-inset-bottom))}
}
@media(max-width:760px){
  #app{display:block}#map{width:100%;height:100%}
  #side{position:absolute;bottom:0;left:0;width:100%;height:62dvh;max-height:none;z-index:1001;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -3px 18px #0003}
  #side.closed{height:0;max-height:0;width:100%;border:0;box-shadow:none}
  #side header{max-height:27dvh}#side h1{padding-right:0;font-size:14px}
  #list{min-height:0}#selectionBar{padding:7px 12px}
  #toggle,#side.closed #toggle{position:absolute;left:auto;right:12px;top:-46px;transform:none;writing-mode:horizontal-tb;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:8px}
  #side:not(.closed)~#map .leaflet-bottom{bottom:calc(62dvh + 8px)}
  #side.closed~#map .leaflet-bottom{bottom:max(8px,env(safe-area-inset-bottom))}
  #touchTools{max-width:260px}
  #editPanel{width:100%;height:100dvh}
}

/* Scoped form sizing keeps Leaflet radio inputs at their native compact size. */
.leaflet-control-layers input{width:auto!important;min-height:0!important;padding:0!important}
#objectCard[hidden],#basePicker[hidden]{display:none!important}
#objectCard{position:fixed;z-index:1700;right:16px;top:95px;width:290px;max-height:calc(100dvh - 115px);overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:12px 15px;box-shadow:0 4px 20px #0003}
.object-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.object-price{font-size:24px;font-weight:600;letter-spacing:-.5px;margin-top:3px}
.object-metrics{font-size:14px;margin-top:3px}
.object-cad{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.object-cad a{color:var(--accent);text-decoration:underline}
button.cadCopy{width:38px;min-width:38px;min-height:36px;padding:4px;border:0;background:transparent;color:var(--accent);border-radius:7px;cursor:pointer;font-size:19px}
.object-actions{display:flex;gap:8px;margin-top:8px}.object-actions>*{flex:1;text-align:center;text-decoration:none}
.object-detail{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:13px}.object-detail dl{margin:0}.object-detail dt{color:var(--muted);font-size:12px;margin-top:6px}.object-detail dd{margin:0}
#basePicker{position:fixed;z-index:2000;right:14px;top:68px;width:265px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg);padding:10px 15px;box-shadow:0 5px 24px #0003}
.picker-heading{display:flex;align-items:center;justify-content:space-between;font-weight:600}
.base-option{width:100%;min-height:46px;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--fg);padding:8px 0;text-align:left;font:inherit;cursor:pointer}
.base-option[aria-pressed="true"]{color:var(--accent);font-weight:600}.base-option .base-label{flex:1}
.base-swatch{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;background:repeating-linear-gradient(35deg,var(--panel) 0 8px,#8dba9066 8px 16px)}
.base-swatch.satellite{background:linear-gradient(40deg,#294b32,#87955c)}
.base-swatch.hybrid{background:repeating-linear-gradient(40deg,#345d36 0 9px,#cad2a6 9px 11px)}
.base-swatch.osm{background:repeating-linear-gradient(100deg,#dedccc 0 9px,#adc7cd 9px 12px)}
.base-grid{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 4px;border-top:1px solid var(--line)}.base-grid input{width:20px;min-height:20px;height:20px}
#baseBackdrop{position:fixed;inset:0;z-index:1999;background:#0004}#baseBackdrop[hidden]{display:none}
#basePickerButton{min-height:44px;padding:8px 12px}
@media(max-width:760px){#objectCard{top:auto;right:8px;left:8px;bottom:max(8px,env(safe-area-inset-bottom));width:auto;max-height:72dvh;padding:9px 15px 12px}#basePicker{top:auto;bottom:0;left:0;right:0;width:auto;border-radius:20px 20px 0 0;padding:13px 18px max(18px,env(safe-area-inset-bottom))}.object-actions button.action,.object-actions a{font-size:14px;min-height:42px}#side.closed~#map .leaflet-bottom{bottom:58px}#touchTools{max-width:270px}}
#list{min-height:min(200px,30dvh);overscroll-behavior:contain;scrollbar-gutter:stable}
#side header{flex:0 1 auto;min-height:0}
#selectionBar,#listSummary{flex-shrink:0}
#listSummary{padding:7px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
#side.closed #listSummary{display:none}
.list-filters-button{display:none}
@media(max-width:760px){
  #side{height:76dvh}
  #side:not(.closed)~#map .leaflet-bottom{bottom:calc(76dvh + 8px)}
  #selectionHelp{display:none}
  #selectionBar button.action{font-size:14px;min-height:40px;padding:6px 8px}
  #list{min-height:min(190px,29dvh)}
  #side.has-selection header{max-height:28dvh}
  #side.has-selection .list-filters-button{display:block;margin-top:5px;font-size:13px;min-height:36px}
  #side.has-selection:not(.filters-open) header>:not(h1):not(.list-filters-button){display:none}
}

#compareDialog header{flex-wrap:wrap}
.column-filter{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--fg);font:inherit;font-weight:600;min-height:36px;padding:4px 0;cursor:pointer}
.column-filter[aria-pressed="true"]{color:var(--accent)}
.column-filter .filter-arrow{font-size:11px}
#compareFilterPanel{position:absolute;z-index:10;width:290px;max-width:calc(100% - 16px);max-height:55dvh;overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 6px 24px #0004}
#compareFilterPanel[hidden]{display:none!important}
.filter-sort-row,.filter-footer{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.filter-values{max-height:170px;overflow:auto;margin:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.filter-value{display:flex;align-items:center;gap:8px;min-height:32px;font-size:13px;overflow-wrap:anywhere}
.filter-value input{width:17px;height:17px;min-height:17px;padding:0;flex-shrink:0}
#filterColumnSearch{margin-top:8px}
@media(pointer:coarse){.column-filter{min-height:44px}.filter-value{min-height:42px}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <button id="toggle" type="button" aria-controls="side" aria-expanded="true" aria-label="Скрыть список участков">Скрыть</button>
    <header>
      <h1>Участки: Симферопольский р-н и Алушта</h1>
      <button id="listFiltersToggle" class="action list-filters-button" type="button" aria-expanded="false">Показать фильтры</button>
      <input id="q" type="search" placeholder="Кадастр, адрес или ID Топнлаба" aria-label="Поиск по кадастру, адресу или ID Топнлаба">
      <div class="row">
        <select id="sh"><option value="">Все муниципальные территории</option></select>
        <select id="pr">
          <option value="">Любая цена</option>
          <option value="0-2000000">до 2 млн</option>
          <option value="2000000-3500000">2–3,5 млн</option>
          <option value="3500000-5000000">3,5–5 млн</option>
          <option value="5000000-999999999">от 5 млн</option>
        </select>
      </div>
      <div class="row">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none">
          <input id="clientView" type="checkbox" style="width:auto;margin:0"> Показ клиенту
        </label>
      </div>
      <div class="row"><select id="village" aria-label="Населённый пункт"><option value="">Все населённые пункты</option></select></div>
      <details id="numericFilters"><summary>Площадь, цена за сотку и сортировка</summary>
        <label class="filterLabel">Площадь земли, сот.<span class="row"><input id="areaMin" type="number" min="0" step="any" placeholder="от" aria-label="Площадь от, соток"><input id="areaMax" type="number" min="0" step="any" placeholder="до" aria-label="Площадь до, соток"></span></label>
        <label class="filterLabel">Цена за сотку, ₽<span class="row"><input id="unitMin" type="number" min="0" step="any" placeholder="от" aria-label="Цена за сотку от"><input id="unitMax" type="number" min="0" step="any" placeholder="до" aria-label="Цена за сотку до"></span></label>
        <div id="filterError" role="status"></div>
        <select id="sortOrder" aria-label="Сортировка"><option value="default">Исходный порядок</option><option value="price-asc">Цена: сначала дешевле</option><option value="price-desc">Цена: сначала дороже</option><option value="area-asc">Площадь: по возрастанию</option><option value="area-desc">Площадь: по убыванию</option><option value="unit-asc">Цена за сотку: по возрастанию</option><option value="unit-desc">Цена за сотку: по убыванию</option></select>
      </details>
      <div id="hierarchyHint" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
      <div id="legend"></div>
      <div id="stat"></div>
    </header>
    <div id="selectionBar">
      <div id="selectionCount" role="status" aria-live="polite">Выбрано: 0</div>
      <div class="row"><button class="action" id="onlySelected" type="button" aria-pressed="false">Только выбранные</button><button class="action" id="compareSelected" type="button" disabled>Сравнить</button><button class="action" id="copySelected" type="button" disabled>Копировать</button><button class="action" id="clearSelected" type="button" disabled>Снять выделение</button></div>
      <div id="copyStatus" role="status" aria-live="polite"></div>
      <div id="selectionHelp" style="margin-top:5px;color:var(--muted)">Shift + клик — выбрать; Shift + перетаскивание — рамка. Также можно отметить флажки.</div>
    </div>
    <div id="listSummary" role="status"></div>
    <ul id="list" aria-label="Список объектов"></ul>
  </aside>
  <div id="map"></div>
</div>
<section id="objectCard" hidden aria-label="Карточка объекта"></section>
<div id="baseBackdrop" hidden></div><section id="basePicker" hidden aria-label="Вид карты"><div class="picker-heading">Вид карты<button class="action" id="closeBasePicker" type="button">Закрыть</button></div><div id="baseOptions"></div><label class="base-grid">Кадастровая сетка<input id="baseGridToggle" type="checkbox" checked></label></section>
<div id="editPanel" hidden aria-hidden="true" aria-labelledby="editTitle">
  <header>
    <div>
      <h2 id="editTitle">Редактор объекта</h2>
      <div class="meta">Ctrl+Y · закрыть Ctrl+N</div>
    </div>
    <button type="button" id="editClose" aria-label="Закрыть редактор">×</button>
  </header>
  <form id="editForm" onsubmit="return false">
    <label>Кадастровый номер<input id="edCad" class="cadro" type="text" readonly tabindex="-1"></label>
    <label>Топнлаб id<input id="edId" class="cadro" type="text" inputmode="numeric" autocomplete="off"></label>
    <label>Цена, ₽<input id="edPrice" type="number" min="0" step="1000"></label>
    <label>Населённый пункт<input id="edVill" type="text" placeholder="например Доброе"></label>
    <label>Поселение <span id="editColorDot" class="dot" title="цвет на карте"></span><input id="edSheet" type="text" placeholder="например Добровское"></label>
    <label>Тип (kind)<input id="edKind" type="text" placeholder="участок / дом"></label>
    <label>Заголовок<input id="edTitle" type="text"></label>
    <label>Агент<input id="edAgent" type="text"></label>
    <label>src<input id="edSrc" type="text"></label>
    <label>Авито URL<input id="edAvito" type="url"></label>
  </form>
  <div id="editFoot">
    <div id="editStatus"></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:0 0 8px;cursor:pointer;user-select:none">
      <input id="editAutoPick" type="checkbox" style="width:auto;margin:0"> Авто: клик по объекту открывает редактор (после пароля)
    </label>
    <div class="actions">
      <button type="button" class="primary" id="editApply">Применить</button>
      <button type="button" id="editPatch">Скачать патч сессии (0)</button>
      <a class="btn" id="editTopnlab" href="#" target="_blank" rel="noopener" hidden>Карточка CRM</a>
    </div>
  </div>
</div>

  L.DomEvent.disableClickPropagation(box);L.DomEvent.disableScrollPropagation(box);return box;
};
touchControl.addTo(map);
document.getElementById("touchSelect").addEventListener("click",()=>setTouchSelection(touchSelectionMode&&!boxSelectionMode?"off":"tap"));
document.getElementById("touchBox").addEventListener("click",()=>setTouchSelection(boxSelectionMode?"off":"box"));
document.getElementById("touchDone").addEventListener("click",()=>setTouchSelection("off"));
document.getElementById("touchCompare").addEventListener("click",()=>{renderComparison();document.getElementById("compareDialog").showModal();});
document.getElementById("touchCopy").addEventListener("click",copySelectedCads);
// No visible editor controls or hints: hold the title for two seconds to use the existing password gate.
const brand=document.querySelector("#side h1");
let editorHold=null,editorHoldStart=null;
function cancelEditorHold(){if(editorHold!==null)clearTimeout(editorHold);editorHold=null;editorHoldStart=null;}
brand.addEventListener("touchstart",e=>{
  cancelEditorHold();if(e.touches.length!==1)return;
  editorHoldStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
  editorHold=setTimeout(()=>{editorHold=null;editorHoldStart=null;openObjectEditor();},2000);
},{passive:true});
brand.addEventListener("touchmove",e=>{if(editorHoldStart&&(e.touches.length!==1||Math.hypot(e.touches[0].clientX-editorHoldStart.x,e.touches[0].clientY-editorHoldStart.y)>12))cancelEditorHold();},{passive:true});
for(const event of ["touchend","touchcancel"])brand.addEventListener(event,cancelEditorHold,{passive:true});
brand.addEventListener("contextmenu",e=>{if(isTouchDevice())e.preventDefault();});

// A transparent rectangle with a large clipped shadow leaves its contents at normal brightness.
const mapElement=map.getContainer();
let dragSelection=null;
function startSelection(e,point){
  const start=map.mouseEventToContainerPoint(point),element=document.createElement("div");
  element.className="selection-rect";element.hidden=true;mapElement.appendChild(element);
  dragSelection={start,end:start,element,moved:false,wasDragging:map.dragging.enabled(),userSelect:document.body.style.userSelect};
  map.dragging.disable();document.body.style.userSelect="none";
  e.preventDefault();e.stopImmediatePropagation();
}
function moveSelection(e,point){
  if(!dragSelection)return;
  const drag=dragSelection;drag.end=map.mouseEventToContainerPoint(point);
  if(drag.start.distanceTo(drag.end)>=5)drag.moved=true;
  if(drag.moved){
    drag.element.hidden=false;
    Object.assign(drag.element.style,{left:Math.min(drag.start.x,drag.end.x)+"px",top:Math.min(drag.start.y,drag.end.y)+"px",width:Math.abs(drag.end.x-drag.start.x)+"px",height:Math.abs(drag.end.y-drag.start.y)+"px"});
  }
  e.preventDefault();e.stopImmediatePropagation();
}
function finishSelection(commit){
  if(!dragSelection)return;
  const drag=dragSelection;dragSelection=null;
  drag.element.remove();
  if(drag.wasDragging)map.dragging.enable();
  document.body.style.userSelect=drag.userSelect;
  if(drag.moved){
    suppressPlotClickUntil=Date.now()+500;
    if(commit){
      const bounds=L.latLngBounds(map.containerPointToLatLng(drag.start),map.containerPointToLatLng(drag.end));
      addSelectionInBounds(visibleObjects,bounds,d=>{const entry=layers.get(d.cad);return entry&&entry.m.getLatLng();});
      onlySelected=selectedCads.size>0;
      apply();
    }
  }
}
mapElement.addEventListener("mousedown",e=>{
  if((!e.shiftKey&&!boxSelectionMode)||e.button!==0||e.target.closest(".leaflet-control,.leaflet-popup"))return;
  startSelection(e,e);
},true);
document.addEventListener("mousemove",e=>moveSelection(e,e),true);
document.addEventListener("mouseup",e=>{if(dragSelection){e.preventDefault();e.stopImmediatePropagation();finishSelection(true);}},true);
mapElement.addEventListener("touchstart",e=>{
  if(e.touches.length>1){finishSelection(false);return;}
  if(!boxSelectionMode||e.target.closest(".leaflet-control,.leaflet-popup"))return;
  startSelection(e,e.touches[0]);
},{capture:true,passive:false});
document.addEventListener("touchmove",e=>{if(!dragSelection)return;if(e.touches.length!==1){finishSelection(false);return;}moveSelection(e,e.touches[0]);},{capture:true,passive:false});
document.addEventListener("touchend",e=>{if(!dragSelection)return;e.preventDefault();e.stopImmediatePropagation();suppressPlotClickUntil=Date.now()+500;finishSelection(true);},{capture:true,passive:false});
document.addEventListener("touchcancel",()=>finishSelection(false),true);
mapElement.addEventListener("click",e=>{if(Date.now()<suppressPlotClickUntil&&!e.target.closest(".leaflet-control")){e.preventDefault();e.stopImmediatePropagation();}},true);
window.addEventListener("blur",()=>{finishSelection(false);cancelEditorHold();});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(dragSelection){finishSelection(false);return;}
  if(document.getElementById("compareDialog").open||e.target.closest("input,textarea,select"))return;
  if(touchSelectionMode){setTouchSelection("off");return;}
  selectedCads.clear();onlySelected=false;apply();
});
updateTouchTools();
document.getElementById("objectCard").addEventListener("click",e=>{if(e.target.closest("[data-card-close]")){document.getElementById("objectCard").hidden=true;return;}if(e.target.closest("[data-card-details]")){objectDetailsExpanded=!objectDetailsExpanded;renderObjectCard(popupObject);}});
document.addEventListener("click",e=>{const button=e.target.closest("button[data-copy-cad],button[data-copy-id]");if(!button)return;e.preventDefault();e.stopPropagation();copyOneCad(button.dataset.copyId||button.dataset.copyCad,button,button.dataset.copyId?"ID Топнлаба":"кадастр");},true);
syncToggle();
document.querySelector('#compareDialog thead').addEventListener('click',e=>{const button=e.target.closest('button[data-column]');if(button)openColumnFilter(button);});
document.getElementById('resetCompareFilters').addEventListener('click',()=>{for(const key of Object.keys(comparisonFilters))delete comparisonFilters[key];comparisonSort=null;closeColumnFilter();renderComparison();});
document.getElementById('compareFilterPanel').addEventListener('input',e=>{if(e.target.id==='filterColumnSearch')renderColumnValues();});
document.getElementById('compareFilterPanel').addEventListener('change',e=>{
  if(!columnFilterDraft||columnFilterDraft.numeric)return;
  if(e.target.id==='columnAll'){const q=document.getElementById('filterColumnSearch').value.toLowerCase();for(const v of columnFilterDraft.values.filter(v=>(v||'(Пустые)').toLowerCase().includes(q))){if(e.target.checked)columnFilterDraft.selected.add(v);else columnFilterDraft.selected.delete(v);}renderColumnValues();}
  else if(e.target.matches('[data-column-value]')){const v=e.target.dataset.columnValue;if(e.target.checked)columnFilterDraft.selected.add(v);else columnFilterDraft.selected.delete(v);const all=document.getElementById('columnAll');all.indeterminate=true;}
});
document.getElementById('compareFilterPanel').addEventListener('click',e=>{
  if(!columnFilterDraft)return;
  const draft=columnFilterDraft;
  if(e.target.closest('[data-column-cancel]')){closeColumnFilter();return;}
  if(e.target.closest('[data-column-reset]')){delete comparisonFilters[draft.key];closeColumnFilter();renderComparison();return;}
  const sort=e.target.closest('[data-column-sort]');if(sort){comparisonSort={key:draft.key,direction:sort.dataset.columnSort};closeColumnFilter();renderComparison();return;}
  if(!e.target.closest('[data-column-apply]'))return;
  if(draft.numeric){
    const a=document.getElementById('columnMin'),b=document.getElementById('columnMax'),range=parseRange(a.value,b.value);
    if(!range.valid||!a.validity.valid||!b.validity.valid){document.getElementById('columnError').textContent='Укажите корректный диапазон: «от» не больше «до».';return;}
    const empty=document.getElementById('columnEmpty').checked;
    if(!range.active&&empty)delete comparisonFilters[draft.key];else comparisonFilters[draft.key]={type:'number',min:range.min,max:range.max,empty};
  }else{if(draft.selected.size===draft.values.length)delete comparisonFilters[draft.key];else comparisonFilters[draft.key]={type:'text',values:new Set(draft.selected)};}
  closeColumnFilter();renderComparison();
});
document.getElementById('compareDialog').addEventListener('click',e=>{if(!e.target.closest('#compareFilterPanel,.column-filter'))closeColumnFilter();});
document.getElementById('compareDialog').addEventListener('close',closeColumnFilter);
document.getElementById('compareDialog').addEventListener('cancel',e=>{if(!document.getElementById('compareFilterPanel').hidden){e.preventDefault();closeColumnFilter();}});
document.querySelector('.compareScroll').addEventListener('scroll',closeColumnFilter);

document.getElementById("listFiltersToggle").addEventListener("click",e=>{const open=sideEl.classList.toggle("filters-open");e.currentTarget.setAttribute("aria-expanded",String(open));e.currentTarget.textContent=open?"Скрыть фильтры":"Показать фильтры";});
toggleBtn.addEventListener("click", () => setSideClosed(!sideEl.classList.contains("closed"), true));
applyTheme();
apply();
const all = [...layers.values()].map(x=>x.m.getLatLng());
if (all.length) map.fitBounds(L.latLngBounds(all), {padding:[30,30]});
</script>

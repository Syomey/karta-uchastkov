<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Подборка объектов</title><link rel="stylesheet" href="/assets/leaflet/leaflet.css"><link rel="stylesheet" href="/assets/share.css"><script defer src="/assets/leaflet/leaflet.js"></script><script defer src="/assets/share.js"></script></head>
<body><div id="app"><aside id="side"><header><h1>Подборка объектов</h1><p id="status" role="status">Загружаем подборку…</p><input id="search" type="search" placeholder="Кадастр, населённый пункт, ID" aria-label="Поиск в подборке"><div class="row"><button class="action" id="compare" disabled>Сравнить</button><button class="action" id="copyAll" disabled>Копировать кадастры</button></div><div id="count"></div></header><ul id="list" aria-label="Объекты подборки"></ul></aside><button class="action" id="toggle" aria-controls="side" aria-expanded="true">Список</button><main id="map" aria-label="Карта подборки"></main><div id="mapTools"><button class="action" id="baseToggle" aria-expanded="false">Карта</button><div id="basePicker" hidden><button class="action" data-base="scheme" aria-pressed="true">Схема</button><button class="action" data-base="satellite" aria-pressed="false">Спутник</button></div></div><button class="action" id="overview">Все объекты</button><p id="mapNotice" role="status" hidden></p><section id="objectCard" hidden aria-label="Карточка объекта"></section></div><dialog id="compareDialog"><header><h2>Сравнение объектов</h2><button class="action" id="closeCompare">Закрыть</button></header><div id="comparison"></div></dialog></body></html>
